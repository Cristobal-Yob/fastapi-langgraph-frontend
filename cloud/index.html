<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agente LangGraph</title>
<style>body{font:18px system-ui;max-width:44rem;margin:4rem auto;padding:1rem;background:#10151d;color:#f7f8fb}input,textarea,button{box-sizing:border-box;width:100%;font:inherit;padding:.8rem;margin:.5rem 0}article{white-space:pre-wrap;border-top:1px solid #6b7689;padding:1rem 0}label{display:block}</style>
<a href="#message">Ir al mensaje</a><h1>Consultar al agente</h1><p>Una instancia de enseñanza para un operador. La memoria se pierde al reiniciar.</p><label>Clave del operador<input id="token" type="password" autocomplete="off"></label><form id="form"><label>Mensaje<textarea id="message" maxlength="2000" required></textarea></label><button id="send">Enviar consulta</button></form><p id="state" role="status"></p><section id="answers" aria-live="polite"></section>
<script>
const find=id=>document.getElementById(id);let session='web-'+crypto.randomUUID(),token='';
find('form').onsubmit=async event=>{event.preventDefault();const text=find('message').value.trim();if(!text)return;token=find('token').value||token;find('token').value='';find('send').disabled=true;find('state').textContent='Consultando';const headers={Authorization:'Bearer '+token,'Content-Type':'application/json'};try{let r=await fetch('/chat',{method:'POST',headers,body:JSON.stringify({message:text,conversation_id:session,request_id:crypto.randomUUID()})});if(r.status!==202)throw Error();const job=await r.json();let done=false;for(let i=0;i<320;i++){r=await fetch(job.status_url,{headers});if(!r.ok)throw Error();const value=await r.json();if(value.status==='failed')throw Error();if(value.status==='done'){const article=document.createElement('article');article.textContent=text+'\n\n'+value.result.response;find('answers').append(article);find('message').value='';done=true;break}await new Promise(resolve=>setTimeout(resolve,500))}if(!done)throw Error();find('state').textContent='Respuesta completa'}catch{find('state').textContent='No se pudo completar. No se reenviará automáticamente.'}finally{find('send').disabled=false}};
</script></html>
